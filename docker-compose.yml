version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailflow-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/templates:/app/templates
      - ./backend/config:/app/config
      - ./backend/email_automation.db:/app/email_automation.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
